name: Release Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Required for next releases; leave empty for dev"
        required: false
        type: string
      confirm_version:
        description: "Required for next releases; leave empty for dev"
        required: false
        type: string
      mode:
        description: "dry-run validates only; publish performs npm publication"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      dist_tag:
        description: "Publish channel; dev leaves next and latest unchanged"
        required: true
        default: next
        type: choice
        options:
          - next
          - dev
      promote_latest:
        description: "Stable only: after next verification promote both packages to latest"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dist_tag == 'dev' && 'main' || inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Resolve release version
        id: version
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [ "$DIST_TAG" = "dev" ]; then
            node scripts/release/prepare-dev-version.mjs
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          MODE: ${{ inputs.mode }}
          DIST_TAG: ${{ inputs.dist_tag }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          if [ "$DIST_TAG" = "dev" ]; then
            node scripts/release/preflight-publish.mjs --mode "$MODE" --dist-tag dev --promote-latest "$PROMOTE_LATEST"
          else
            node scripts/release/preflight-publish.mjs --tag "$RELEASE_TAG" --confirm "$CONFIRM_VERSION" --mode "$MODE" --dist-tag next --promote-latest "$PROMOTE_LATEST"
          fi

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dist_tag == 'dev' && 'main' || inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Apply generated dev version
        if: inputs.dist_tag == 'dev'
        run: node scripts/release/prepare-dev-version.mjs --version "${{ needs.preflight.outputs.version }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint release changes
        run: npx eslint scripts/release tests/pipeline/npm-publish.test.ts tests/pipeline/cannbot-pack.test.ts

      - name: Prepare test database
        run: node scripts/ensure-test-db.mjs

      - name: Release packaging tests
        run: npx vitest run tests/pipeline/npm-publish.test.ts tests/pipeline/cannbot-pack.test.ts

      - name: Browser E2E
        run: npm run e2e

      - name: Build release artifacts
        run: npm run release:prepare

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Generate checksums
        run: sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dist_tag == 'dev' && 'main' || inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts

      - name: Verify downloaded checksums
        run: sha256sum -c release-artifacts/SHA256SUMS

      - name: Create dev release tag
        if: inputs.dist_tag == 'dev'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish packages to selected dist-tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          npm publish "./release-artifacts/context-insight-${VERSION}.tgz" --tag "$DIST_TAG" --access public --provenance
          npm publish "./release-artifacts/cannbot-insight-${VERSION}.tgz" --tag "$DIST_TAG" --access public --provenance

      - name: Verify packages from selected dist-tag
        run: node scripts/release/verify-registry.mjs --tag "${{ inputs.dist_tag }}" --version "${{ needs.preflight.outputs.version }}"

      - name: Promote packages to latest
        if: inputs.promote_latest == true && inputs.dist_tag != 'dev'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          npm dist-tag add "context-insight@${VERSION}" latest
          npm dist-tag add "cannbot-insight@${VERSION}" latest

      - name: Verify packages from npm latest
        if: inputs.promote_latest == true && inputs.dist_tag != 'dev'
        run: node scripts/release/verify-registry.mjs --tag latest --version "${{ needs.preflight.outputs.version }}"
