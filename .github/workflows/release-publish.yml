name: Release Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.5"
        required: true
        type: string
      confirm_version:
        description: "Type the package version without v"
        required: true
        type: string
      mode:
        description: "dry-run validates only; publish performs npm publication"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      promote_latest:
        description: "After next verification, promote both packages to latest"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Validate release identity
        run: node scripts/release/preflight-publish.mjs --tag "${{ inputs.release_tag }}" --confirm "${{ inputs.confirm_version }}" --mode "${{ inputs.mode }}"

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint release changes
        run: npx eslint scripts/release tests/pipeline/npm-publish.test.ts tests/pipeline/cannbot-pack.test.ts

      - name: Prepare test database
        run: node scripts/ensure-test-db.mjs

      - name: Release packaging tests
        run: npx vitest run tests/pipeline/npm-publish.test.ts tests/pipeline/cannbot-pack.test.ts

      - name: Browser E2E
        run: npm run e2e

      - name: Build release artifacts
        run: npm run release:prepare

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Generate checksums
        run: sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org/"

      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: release-artifacts

      - name: Verify downloaded checksums
        run: sha256sum -c release-artifacts/SHA256SUMS

      - name: Publish packages to next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured in the npm-release environment" >&2
            exit 1
          fi
          npm publish "release-artifacts/context-insight-${VERSION}.tgz" --tag next --access public --provenance
          npm publish "release-artifacts/cannbot-insight-${VERSION}.tgz" --tag next --access public --provenance

      - name: Verify packages from npm next
        run: node scripts/release/verify-registry.mjs --tag next --version "${{ needs.preflight.outputs.version }}"

      - name: Promote packages to latest
        if: inputs.promote_latest == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured in the npm-release environment" >&2
            exit 1
          fi
          npm dist-tag add "context-insight@${VERSION}" latest
          npm dist-tag add "cannbot-insight@${VERSION}" latest

      - name: Verify packages from npm latest
        if: inputs.promote_latest == true
        run: node scripts/release/verify-registry.mjs --tag latest --version "${{ needs.preflight.outputs.version }}"
